name: Noonday
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "26.1"
    macOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "6.0.0"
    CURRENT_PROJECT_VERSION: "202610251600"
    DEVELOPMENT_TEAM: QMM486NPYC
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Noonday
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targets:
  Noonday-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ../Noonday.icon
    dependencies:
      - target: NoondayWidgets-iOS
      # NoondayWatch joins in 6.1: Watch screenshots need a watchOS simulator runtime (no disk for it on 2026-10-25)
    settings:
      base:
        PRODUCT_NAME: Noonday
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock   # kept from before the rename: it is the App Store record's id
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Noonday.entitlements
        TARGETED_DEVICE_FAMILY: "1"                      # iPhone first; iPad needs its own screenshot set
        ASSETCATALOG_COMPILER_APPICON_NAME: Noonday
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities

  Noonday-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
      - path: ../Noonday.icon
    dependencies:
      - target: NoondayWidgets-macOS
    settings:
      base:
        PRODUCT_NAME: Noonday
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock   # same id as iOS: universal purchase, one App Store record
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/Noonday.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Noonday
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        PRODUCT_MODULE_NAME: Noonday_macOS

  NoondayWidgets-iOS:
    type: app-extension
    platform: iOS
    sources: &widgetSources
      - path: Widgets
      - path: Shared
        excludes: ["AlarmScheduler.swift"]
    settings:
      base:
        PRODUCT_NAME: NoondayWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Noonday
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

  NoondayWidgets-macOS:
    type: app-extension
    platform: macOS
    sources: *widgetSources
    settings:
      base:
        PRODUCT_NAME: NoondayWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets-mac.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Noonday
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_MODULE_NAME: NoondayWidgets_macOS

  NoondayWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
      - path: ../Noonday.icon
    dependencies:
      - target: NoondayWatchWidgets
    settings:
      base:
        PRODUCT_NAME: Noonday
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.nulljosh.clock
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Noonday
        SKIP_INSTALL: YES

  NoondayWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: *widgetSources
    settings:
      base:
        PRODUCT_NAME: NoondayWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.watchkitapp.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Noonday
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

  NoondayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Shared/Clockwork.swift
      - path: Shared/Models.swift
      - path: Shared/Store.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.tests
        GENERATE_INFOPLIST_FILE: YES

  # Mac App Store screenshots drawn off screen in the test runner: no app launch, nothing on the display.
  # TEST_RUNNER_NOONDAY_SHOTS=/some/folder xcodebuild test -scheme NoondaySnapshots
  NoondaySnapshots:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Snapshots
      - path: App
        excludes: ["NoondayApp.swift"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.snapshots
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Noonday-iOS:
    build: { targets: { Noonday-iOS: all } }
    archive: { config: Release }
  Noonday-macOS:
    build: { targets: { Noonday-macOS: all } }
    archive: { config: Release }
  NoondayTests:
    build: { targets: { NoondayTests: all } }
    test: { targets: [NoondayTests] }
  NoondaySnapshots:
    build: { targets: { NoondaySnapshots: all } }
    test: { targets: [NoondaySnapshots] }
