name: ClearClock
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "26.1"
    macOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "6.0.1"
    CURRENT_PROJECT_VERSION: "202610251600"
    DEVELOPMENT_TEAM: QMM486NPYC
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Clear Clock"
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targets:
  ClearClock-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ../ClearClock.icon
    dependencies:
      - target: ClearClockWidgets-iOS
      # ClearClockWatch joins in 6.1: Watch screenshots need a watchOS simulator runtime (no disk for it on 2026-10-25)
    settings:
      base:
        PRODUCT_NAME: ClearClock
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock   # kept from before the rename: it is the App Store record's id
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/ClearClock.entitlements
        TARGETED_DEVICE_FAMILY: "1"                      # iPhone first; iPad needs its own screenshot set
        ASSETCATALOG_COMPILER_APPICON_NAME: ClearClock
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities

  ClearClock-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
      - path: ../ClearClock.icon
    dependencies:
      - target: ClearClockWidgets-macOS
    settings:
      base:
        PRODUCT_NAME: ClearClock
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock   # same id as iOS: universal purchase, one App Store record
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/ClearClock.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ClearClock
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        PRODUCT_MODULE_NAME: ClearClock_macOS

  ClearClockWidgets-iOS:
    type: app-extension
    platform: iOS
    sources: &widgetSources
      - path: Widgets
      - path: Shared
        excludes: ["AlarmScheduler.swift"]
    settings:
      base:
        PRODUCT_NAME: ClearClockWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Clear Clock"
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

  ClearClockWidgets-macOS:
    type: app-extension
    platform: macOS
    sources: *widgetSources
    settings:
      base:
        PRODUCT_NAME: ClearClockWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets-mac.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: "Clear Clock"
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_MODULE_NAME: ClearClockWidgets_macOS

  ClearClockWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
      - path: ../ClearClock.icon
    dependencies:
      - target: ClearClockWatchWidgets
    settings:
      base:
        PRODUCT_NAME: ClearClock
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.nulljosh.clock
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ClearClock
        SKIP_INSTALL: YES

  ClearClockWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: *widgetSources
    settings:
      base:
        PRODUCT_NAME: ClearClockWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.watchkitapp.widgets
        INFOPLIST_KEY_CFBundleDisplayName: "Clear Clock"
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

  ClearClockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Shared/Clockwork.swift
      - path: Shared/Models.swift
      - path: Shared/Store.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.tests
        GENERATE_INFOPLIST_FILE: YES

  # Mac App Store screenshots drawn off screen in the test runner: no app launch, nothing on the display.
  # TEST_RUNNER_CLEARCLOCK_SHOTS=/some/folder xcodebuild test -scheme ClearClockSnapshots
  ClearClockSnapshots:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Snapshots
      - path: App
        excludes: ["ClearClockApp.swift"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.snapshots
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ClearClock-iOS:
    build: { targets: { ClearClock-iOS: all } }
    archive: { config: Release }
  ClearClock-macOS:
    build: { targets: { ClearClock-macOS: all } }
    archive: { config: Release }
  ClearClockTests:
    build: { targets: { ClearClockTests: all } }
    test: { targets: [ClearClockTests] }
  ClearClockSnapshots:
    build: { targets: { ClearClockSnapshots: all } }
    test: { targets: [ClearClockSnapshots] }
