name: Tocks
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "26.1"
    macOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "6.0.1"
    CURRENT_PROJECT_VERSION: "202610251600"
    DEVELOPMENT_TEAM: QMM486NPYC
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Tocks"
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targets:
  Tocks-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ../Tocks.icon
    dependencies:
      - target: TocksWidgets-iOS
      # TocksWatch joins in 6.1: Watch screenshots need a watchOS simulator runtime (no disk for it on 2026-10-25)
    settings:
      base:
        PRODUCT_NAME: Tocks
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock   # kept from before the rename: it is the App Store record's id
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Tocks.entitlements
        TARGETED_DEVICE_FAMILY: "1"                      # iPhone first; iPad needs its own screenshot set
        ASSETCATALOG_COMPILER_APPICON_NAME: Tocks
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities

  Tocks-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
      - path: ../Tocks.icon
    dependencies:
      - target: TocksWidgets-macOS
    settings:
      base:
        PRODUCT_NAME: Tocks
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock   # same id as iOS: universal purchase, one App Store record
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/Tocks.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Tocks
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        PRODUCT_MODULE_NAME: Tocks_macOS

  TocksWidgets-iOS:
    type: app-extension
    platform: iOS
    sources: &widgetSources
      - path: Widgets
      - path: Shared
        excludes: ["AlarmScheduler.swift"]
    settings:
      base:
        PRODUCT_NAME: TocksWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Tocks"
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

  TocksWidgets-macOS:
    type: app-extension
    platform: macOS
    sources: *widgetSources
    settings:
      base:
        PRODUCT_NAME: TocksWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets-mac.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: "Tocks"
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_MODULE_NAME: TocksWidgets_macOS

  TocksWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
      - path: ../Tocks.icon
    dependencies:
      - target: TocksWatchWidgets
    settings:
      base:
        PRODUCT_NAME: Tocks
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.nulljosh.clock
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Tocks
        SKIP_INSTALL: YES

  TocksWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: *widgetSources
    settings:
      base:
        PRODUCT_NAME: TocksWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.watchkitapp.widgets
        INFOPLIST_KEY_CFBundleDisplayName: "Tocks"
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

  TocksTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Shared/Clockwork.swift
      - path: Shared/Models.swift
      - path: Shared/Store.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.tests
        GENERATE_INFOPLIST_FILE: YES

  # Mac App Store screenshots drawn off screen in the test runner: no app launch, nothing on the display.
  # TEST_RUNNER_TOCKS_SHOTS=/some/folder xcodebuild test -scheme TocksSnapshots
  TocksSnapshots:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Snapshots
      - path: App
        excludes: ["TocksApp.swift"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.clock.snapshots
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Tocks-iOS:
    build: { targets: { Tocks-iOS: all } }
    archive: { config: Release }
  Tocks-macOS:
    build: { targets: { Tocks-macOS: all } }
    archive: { config: Release }
  TocksTests:
    build: { targets: { TocksTests: all } }
    test: { targets: [TocksTests] }
  TocksSnapshots:
    build: { targets: { TocksSnapshots: all } }
    test: { targets: [TocksSnapshots] }
